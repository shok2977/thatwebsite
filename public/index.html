<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0f">
<meta name="color-scheme" content="dark">
<title>TubeStream — Free HD Videos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>▶</text></svg>">
<link rel="preconnect" href="https://r.jina.ai" crossorigin>
<link rel="preconnect" href="https://*.xhcdn.com" crossorigin>
<link rel="preload" href="/style.css" as="style">
<link rel="preload" href="/vendor/hls.min.js" as="script">
<link rel="preload" href="/app.js?v=7" as="script">
<link rel="stylesheet" href="style.css?v=7">
<link rel="dns-prefetch" href="https://r.jina.ai">
<link rel="dns-prefetch" href="https://*.xhcdn.com">
<style>
/* Critical inline CSS for instant paint */
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#0a0a0f;color:#f0f0f5;-webkit-font-smoothing:antialiased}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;padding:0 24px;height:56px;background:rgba(10,10,15,0.95);backdrop-filter:blur(12px);border-bottom:1px solid #1e1e30}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:0 24px}
.card{border-radius:10px;overflow:hidden;background:#141420;cursor:pointer;transition:transform 0.2s ease}
.card:hover{transform:translateY(-3px)}
.thumb-wrap{position:relative;aspect-ratio:16/9;background:#080810}
.thumb-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.card-title{padding:10px 12px 12px;font-size:13px;font-weight:500;line-height:1.4;color:#ccc;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hidden{display:none!important}
.status{text-align:center;padding:12px;border-radius:8px;margin:16px 24px;font-size:13px;background:rgba(232,54,78,0.1);border:1px solid rgba(232,54,78,0.2);color:#ffa0a8}
</style>
</head>
<body>
  <header class="topbar">
    <button id="sidebarToggle" class="btn-icon sidebar-toggle" title="Toggle categories">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="brand">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </div>
      <div class="brand-text">
        <h1>TubeStream</h1>
      </div>
    </div>

    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" class="search-input" placeholder="Search videos… ( / )" autocomplete="off" spellcheck="false">
      <button id="searchClear" class="search-clear hidden" aria-label="Clear search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div id="searchDropdown" class="search-dropdown hidden"></div>
    </div>

    <div class="prefetch-progress-wrap">
      <div class="prefetch-progress-bar" id="prefetchBar"></div>
      <span class="prefetch-progress-text" id="prefetchText">Loading…</span>
    </div>

    <div class="topbar-actions">
      <span id="countBadge" class="badge"></span>
      <button id="themeToggle" class="btn-icon" title="Toggle theme">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button id="refreshBtn" class="btn-icon" title="Refresh feed">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <!-- Category Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-content" id="sidebarContent">
        <!-- Populated by JS -->
      </div>
    </aside>

    <main class="main-content">
      <div id="status" class="status hidden"></div>
      <div id="categoryTabs" class="category-tabs">
        <button class="cat-tab active" data-cat="all">🔥 All</button>
        <button class="cat-tab" data-cat="newest">Newest</button>
        <button class="cat-tab" data-cat="hot">Hot</button>
        <button class="cat-tab" data-cat="popular">Popular</button>
        <button class="cat-tab" data-cat="top">Top Rated</button>
        <button class="cat-tab" data-cat="hd">HD</button>
        <button class="cat-tab" data-cat="longest">Longest</button>
      </div>
      <div id="grid" class="grid"></div>
      <div id="paginationWrap" class="pagination-wrap">
        <button id="prevPageBtn" class="page-btn" disabled>‹ Previous</button>
        <div id="pageNumbers" class="page-numbers"></div>
        <button id="nextPageBtn" class="page-btn">Next ›</button>
      </div>
      <div id="loadMoreWrap" class="load-more-wrap hidden">
        <button id="loadMoreBtn" class="btn load-more-btn">Load More</button>
      </div>
      <div id="scrollSentinel" class="scroll-sentinel"></div>
    </main>
  </div>

  <!-- Player modal -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <div class="modal-head-actions">
          <a id="openOnSite" href="#" target="_blank" rel="noopener" class="btn-ghost-sm">Visit Site ↗</a>
          <button id="closeBtn" class="close" aria-label="Close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
      <div class="video-wrap">
        <video id="player" controls playsinline preload="auto"></video>
        <div id="playerLoading" class="player-loading">
          <div class="spinner"></div>
          <span>Loading stream…</span>
        </div>
        <div id="playerError" class="player-error hidden">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
          <p id="playerErrorText">Could not load this stream.</p>
        </div>
      </div>
      <div class="modal-foot">
        <span id="videoMeta" class="meta"></span>
      </div>
    </div>
  </div>

  <!-- Back to top button -->
  <button id="backToTop" class="back-to-top" title="Back to top">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
  </button>

  <!-- Tooltip preview (YouTube-style) -->
  <div id="cardTooltip" class="card-tooltip hidden">
    <div class="tooltip-thumb-wrap">
      <video id="tooltipVideo" class="tooltip-video" muted playsinline preload="none"></video>
      <div class="tooltip-duration" id="tooltipDuration"></div>
    </div>
    <div class="tooltip-info">
      <div class="tooltip-title" id="tooltipTitle"></div>
      <div class="tooltip-status" id="tooltipStatus"></div>
    </div>
  </div>

  <script src="/vendor/hls.min.js"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
